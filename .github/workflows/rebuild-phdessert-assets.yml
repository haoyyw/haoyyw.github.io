name: Rebuild PhDessert assets

on:
  push:
    paths:
      - 'phdessert/assets/encoded/READY'
      - '.github/workflows/rebuild-phdessert-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild high-resolution WebP assets
        shell: bash
        run: |
          set -euo pipefail
          cat phdessert/assets/encoded/part-* | tr -d '\r\n\t ' > /tmp/phdessert-assets.clean.b64
          length=$(wc -c < /tmp/phdessert-assets.clean.b64)
          remainder=$((length % 4))
          echo "Encoded length: $length; remainder: $remainder"
          if [ "$remainder" -ne 0 ]; then
            head -c $((length - remainder)) /tmp/phdessert-assets.clean.b64 > /tmp/phdessert-assets.b64
          else
            cp /tmp/phdessert-assets.clean.b64 /tmp/phdessert-assets.b64
          fi
          base64 --decode /tmp/phdessert-assets.b64 > /tmp/phdessert-assets.tar
          mkdir -p phdessert/assets/images
          tar -xf /tmp/phdessert-assets.tar -C phdessert/assets/images
          ls -lh phdessert/assets/images/*.webp

      - name: Commit rebuilt assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phdessert/assets/images/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
          else
            git commit -m 'fix: restore PhDessert high-resolution assets'
            git push
          fi
